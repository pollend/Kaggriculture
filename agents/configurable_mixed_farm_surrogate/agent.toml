family_id = "configurable_mixed_farm_surrogate"
name = "Configurable Mixed-Farm Surrogate"
entry_point = "agents.configurable_mixed_farm_surrogate.agent:make_agent"
parameter_schema_version = 2
training_adapter = "agents.configurable_mixed_farm_surrogate.training:adapter"
episode_evaluator = "agents.configurable_mixed_farm_surrogate.main:evaluate_episode"

code_paths = [
  "agents/__init__.py",
  "agents/configurable_mixed_farm_surrogate/__init__.py",
  "agents/configurable_mixed_farm_surrogate/main.py",
  "agents/configurable_mixed_farm_surrogate/agent.py",
  "agents/configurable_mixed_farm_surrogate/strategy.py",
  "agents/configurable_mixed_farm_surrogate/rules.py",
  "agents/configurable_mixed_farm_surrogate/portfolio.py",
  "agents/configurable_mixed_farm_surrogate/scheduler.py",
  "agents/configurable_mixed_farm_surrogate/market.py",
  "agents/configurable_mixed_farm_surrogate/_profile.py",
  "agents/configurable_mixed_farm_surrogate/profiles/balanced.json",
]

[[models]]
model_id = "configurable_mixed_farm_surrogate.surrogate"
trainer = "agents.configurable_mixed_farm_surrogate.train:trainer"
min_new_batches = 2

[models.config]
n_estimators = 300
min_samples_leaf = 2
candidate_pool = 10000
moon_min_rows = 20
moon_weight = 0.30
