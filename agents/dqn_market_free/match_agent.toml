family_id = "dqn_market_free_match_policy"
name = "Market Free Match Policy"
entry_point = "agents.dqn_market_free.match_agent:make_agent"
parameter_schema_version = 1
episode_evaluator = "agents.dqn_market_free.main:evaluate_episode"

# Training-only: rollout episodes are recorded as league pairings under this
# identity so they are queryable like any match. It imports `training/`, so it
# is never bundled for submission.
#
# `evaluation.py` and `diagnostics.py` are listed because `episode_evaluator`
# above resolves through `main.__getattr__`, which imports `evaluation`, which
# imports `diagnostics`. Neither is reachable from `match_agent:make_agent`, so
# a fingerprint taken from the entry point alone would miss both.
#
# `training/reward.py` is listed because `training/collect.py` imports it: the
# recorded reward stream is part of what this identity produced, so a change to
# MONEY_SCALE or `potential()` has to mint a new revision rather than reuse one.
code_paths = [
  "agents/__init__.py",
  "agents/dqn_market_free/__init__.py",
  "agents/dqn_market_free/diagnostics.py",
  "agents/dqn_market_free/donor.py",
  "agents/dqn_market_free/evaluation.py",
  "agents/dqn_market_free/match_agent.py",
  "agents/dqn_market_free/main.py",
  "agents/dqn_market_free/market_state.py",
  "agents/dqn_market_free/order_space.py",
  "agents/dqn_market_free/planting.py",
  "agents/dqn_market_free/policy.py",
  "agents/dqn_market_free/training/__init__.py",
  "agents/dqn_market_free/training/collect.py",
  "agents/dqn_market_free/training/reward.py",
]
