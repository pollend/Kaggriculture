family_id = "dqn_market_free"
name = "Market Free (donor scheduler, market-directed planting)"
entry_point = "agents.dqn_market_free.main:agent"
parameter_schema_version = 1
episode_evaluator = "agents.dqn_market_free.main:evaluate_episode"

# Inference and the torch-free episode hook. `training/` is deliberately absent,
# so a bundle built from this allowlist is submission-safe by construction.
#
# `donor.py` and the state half of the scorer's feature schema are local copies.
# Keeping them here makes this inference bundle independent of the scorer and
# ensures the field policy and encoder share the donor's episode state. The
# donor is redistributed under Apache-2.0; LICENSE-pilkwang and NOTICE ship with
# it as required. No `competitor_*` path is ever bundled.
#
# Note there is no `market_exec.py` here. That is the entire point of this
# agent: the donor's market layer is gone and the network emits orders itself.
#
# `weights.npz` is also absent, unlike the scorer's manifest. The league bundles
# this agent as an anchor long before any checkpoint has been exported, and a
# declared-but-missing path fails that bundle. Inference finds the file by path
# when it exists (`policy.WEIGHTS_PATH`), and `export_submission.py` requires it
# for a Kaggle build, which is the only place shipping without it would matter.
code_paths = [
  "agents/__init__.py",
  "agents/dqn_market_free/__init__.py",
  "agents/dqn_market_free/diagnostics.py",
  "agents/dqn_market_free/evaluation.py",
  "agents/dqn_market_free/donor.py",
  "agents/dqn_market_free/LICENSE-pilkwang",
  "agents/dqn_market_free/main.py",
  "agents/dqn_market_free/market_state.py",
  "agents/dqn_market_free/NOTICE",
  "agents/dqn_market_free/order_space.py",
  "agents/dqn_market_free/planting.py",
  "agents/dqn_market_free/policy.py",
]

[[models]]
model_id = "dqn_market_free.raw_order_q_v1"
trainer = "agents.dqn_market_free.train:trainer"
min_new_batches = 20

[models.config]
batches_per_round = 1
# Must be even: seeds are played in consecutive pairs so each is seen from both
# seats.
episodes_per_batch = 16

league_opponents = true

# One decision per turn, so an episode yields 720 decisions against the scorer's
# 60. That throughput is what makes one order per turn enough, and it is why the
# buffer is sized in episodes rather than transitions.
buffer_episodes = 400
reservoir_fraction = 0.35
warmup_episodes = 16

# One in-game day. The credit this has to carry is a crop cycle -- 48 to 96
# turns from BUY_SEED to the harvest that pays for it -- so the previous 8, a
# third of a day, walked that credit back at a crawl.
n_step = 24

# The season is a hard 720-turn deadline, not an infinite horizon: stock held
# past the last turn scores nothing. Time to the end is already in the state
# (`step/episode_steps`, turns remaining, days remaining), so the finite-horizon
# problem is well posed and the discount only has to keep values bounded.
#
# At the previous 0.997 the horizon was 1/(1-gamma) = 333 turns, under half the
# season: a melon planted on day 3 and sold on day 10 was discounted to 0.60,
# and terminal liquidation seen from mid-season to about 0.4. 0.999 puts the
# horizon at 1000 turns, past the end of the episode.
gamma = 0.999

# Share of every minibatch drawn from the pinned demonstrations rather than from
# self-collected episodes. Solvent trajectories are rare enough that an
# unweighted draw over the agent's own data is almost entirely bankruptcies, and
# the only policy consistent with that is NOOP. This is what replaced rank-based
# prioritisation over episode final money: it puts the same solvent signal in
# every batch by construction, with no sampling bias to correct and no
# importance-sampling exponent to anneal. Ignored when nothing is pinned.
demo_fraction = 0.25

# The bootstrap is a max over the 186-wide action head, not over an expanded
# candidate grid, so there is nothing left to chunk and a wide batch is cheap.
batch_size = 256
gradient_steps_per_batch = 100
learning_rate = 0.0001
weight_decay = 0.0
target_sync = 2000
# Both learning rates are re-applied from config on every resume, so changing one
# mid-run takes effect instead of being overwritten by the optimizer state the
# checkpoint carries. The moments themselves survive unless this is set: turn it
# on when the run is deliberately leaving a regime behind and the averaged
# gradient history of the old one would only damp the change.
reset_optimizer_moments = false

# Probability that a turn emits a uniformly random real order. This is the whole
# exploration schedule: it absorbed a separate per-slot `act_rate`, because only
# the product of the two ever mattered and splitting them meant the effective
# rate was a number nobody could read off this file.
#
# It has to stay small, and that is measured rather than assumed. At per-turn
# rates of 1.0, 0.1, 0.02 and even 0.005 the episode ends on 5, 185, 48 and 4
# coins from a 3000 float, because random BUY_LAND and BUY_ANIMAL draws bankrupt
# it before anything is ever planted.
epsilon_start = 0.02
epsilon_end = 0.002
# Counted in decisions, which accumulate 12x faster than the scorer's.
epsilon_decay_transitions = 2000000

# Demonstrations from stored league replays, pinned in the buffer and never
# evicted. The manifest remains the reward-only control; named demo experiments
# override both values and run supervised order classification before each DQN
# fine-tuning phase.
demonstration_episodes = 0
demonstration_min_money = 10000.0

# "significant" (lower CI bound above zero) or "point_estimate" (margin above
# zero), measured on the paired head-to-head against the released incumbent.
promotion_rule = "significant"
eval_seeds = 100
promotion_seeds = 100
promotion_seed_base = 1000000
promotion_seed_stride = 10000

# Hard viability gate. Competitive margin is still the release objective, but a
# candidate cannot improve it by bankrupting itself or by refusing to trade at
# all. Money floors are relative to the incumbent's own seat in the same paired
# head-to-head, so they compare like with like.
#
# Measured as the share of turns that emitted anything, not as a wire order
# count -- `HIRE n` is one decision whose wire form is n rows, so a hire-only
# policy reports 13 orders per decision while trading on one turn in fifty.
#
# There is no upper limit: over-trading can only surface as lost money, which the
# floors above already measure.
viability_min_mean_money_ratio = 0.80
viability_min_median_money_ratio = 0.75
# The floor that catches the other attractor. A policy that never trades
# preserves its money perfectly and so clears both floors above. Applied only
# once a checkpoint has been released -- the cold start is silent by design.
viability_min_orders_per_decision = 0.02

# Both training and collection follow the newest checkpoint on the lineage,
# promoted or not; release is gated, the behaviour distribution is not. Snap the
# lineage back to the released checkpoint after this many consecutive rejections
# so a diverged trajectory is not carried forward forever. 0 disables the reset.
resume_reset_after_rejections = 5

jobs = 8
seed = 0

# The same benchmark the scorer uses. The field policy is identical on both
# sides, so this match still isolates the market layer -- and it is now the
# comparison that says whether an unscaffolded market can reach a hand-written
# one.
benchmark = "agents/competitor_pilkwang_kaggriculture_structured_economic_policy/main.py"
opponents = [
  "agents/competitor_pilkwang_kaggriculture_structured_economic_policy/main.py",
  "agents/competitor_kaitofukami_44_46_strict_future_top_30_v22_price_impact/main.py",
  "agents/competitor_lucifer19_kaggriculture_night_harvest/main.py",
  "agents/competitor_tetsutani_adaptive_farming_strategy_for_kaggriculture/main.py",
  "agents/configurable_crop_surrogate/main.py",
]
