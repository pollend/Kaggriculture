[project]
name = "kaggriculture-lab"
version = "0.1.0"
description = "Configurable Kaggriculture agents and surrogate-assisted tournament research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4",
    "kaggle-environments>=1.32.6",
    "pandas>=3.0",
    "scikit-learn>=1.8",
]

[project.scripts]
kaglab = "kaggriculture_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaggriculture_lab", "sim", "agents"]

[tool.hatch.build.targets.wheel.force-include]
"kaggriculture_lab/schema.sql" = "kaggriculture_lab/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests", "sim"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["agents/competitor_*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
